<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرحه أبو بلال</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff7e6, #f8e7c0);
  color: #5b4322;
  text-align: center;
}

.container {
  min-height: 100vh;
  padding: 35px 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 42px;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 22px;
  margin-bottom: 25px;
}

.photo {
  width: 280px;
  max-width: 90%;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  margin-bottom: 25px;
}

.message {
  background: rgba(255,255,255,0.7);
  padding: 20px;
  border-radius: 18px;
  max-width: 600px;
  font-size: 21px;
  line-height: 1.8;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

audio {
  margin-top: 25px;
  width: 90%;
  max-width: 400px;
}
</style>
</head>

<body>

<div class="container">

  <h1>💍 فرحه أبو بلال 💍</h1>

  <div class="subtitle">ألف ألف مبروك يا صاحبي ❤️</div>

  <img class="photo"
  src="Screenshot_20260902_005252_com_whatsapp_ViewProfilePhoto.jpg"
  alt="صورة أبو بلال">

  <div class="message">
    ربنا يسعدك ويهنيك ويتمملك على خير ❤️
    <br>
    ويديم بينكم المحبة والسعادة،
    <br>
    وألف مبروك يا أبو بلال 🎉
  </div>

  <audio controls>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

</div>

</body>
</html>
